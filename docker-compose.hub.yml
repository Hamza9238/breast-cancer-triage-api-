# Clean-room Compose file — uses the published Docker Hub image (no build).
services:
  api:
    image: ${DOCKER_USERNAME}/breast-cancer-triage-api:${IMAGE_TAG:-latest}
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=artifacts/model.joblib
      - DECISION_THRESHOLD=${DECISION_THRESHOLD:-0.5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_VERSION=${MODEL_VERSION:-1.0.0}
      - GIT_SHA=${GIT_SHA:-unknown}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2.7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
